<h1 id="tableLabel">Contest</h1>

<p>This component demonstrates fetching data from the server.</p>


<!--<p *ngIf="!contests?.length"><em>Loading...</em></p>-->

<table class='table table-striped' aria-labelledby="tableLabel" >
  <thead>
    <tr>
      <th>Date</th>
      <th>Temp. (C)</th>
      <th>Temp. (F)</th>
      <th>Summary</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let contest of contests">
      <td>{{ contest.name }}</td>
      <td>{{ contest.name }}</td>
      <td>{{ contest.name }}</td>
      <td>{{ contest.name }}</td>
    </tr>
  </tbody>
</table>
