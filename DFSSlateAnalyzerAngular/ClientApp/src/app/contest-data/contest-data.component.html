<h1 id="tableLabel">Contest</h1>



<p *ngIf="!contests?.length"><em>Loading...</em></p>

<table class='table table-striped' aria-labelledby="tableLabel" >
  <thead>
    <tr>
      <th>Name</th>
      <th>time remaining</th>
      <th>rank</th>
      <th>points</th>
      <th>adjusted ranking</th>
      <th>players</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let entry of contests[0].entries">
      <td>{{ entry.name }}</td>
      <td>{{ entry.timeRemaining }}</td>
      <td>{{ entry.rank }}</td>
      <td>{{ entry.points }}</td>
      <td></td>
      <td  *ngFor="let entryMember of entry.entryMembers"  >
        <div>

          {{entryMember.entryMemberPlayerName}}
          &nbsp;
          <!--<span *ngFor="let player of entryMember.player">-->
          <!--<div *ngIf="!entryMember.player?.fpts.length">-->
          {{entryMember.player.fpts}}
          <!--</div>-->
          <!--</span>-->
          &nbsp;

        </div>
      </td>
    </tr>
  </tbody>
</table>
